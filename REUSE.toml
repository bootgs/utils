version = 1
SPDX-PackageName = "@bootgs/utils"
SPDX-PackageDownloadLocation = "https://github.com/bootgs/utils"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Maksym Stoianov"
