# Pull request and branch checks: types, lint, formatting, tests with coverage, build,
# generated documentation, production dependency audit and production licence allow-list.

name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from `packageManager` in package.json.
      - name: setup-pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: type-check
        run: pnpm run type:check

      - name: lint
        run: pnpm run lint

      - name: format
        run: pnpm run format

      - name: test
        run: pnpm run test:cov --coverage.reporter=text --coverage.reporter=lcov

      # Coverage report to Codecov (OIDC, no token). Never fails the build: forks get no OIDC token.
      - name: codecov
        if: always() && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: build
        run: pnpm run build

      # The reference pages are generated from src/; this fails when they are stale.
      - name: docs
        run: pnpm run docs:check

      - name: readme-translations
        run: pnpm run docs:check-i18n

      - name: audit
        run: pnpm audit --prod --audit-level high

      # Production dependencies must use a permissive licence compatible with Apache-2.0.
      - name: licences
        run: >-
          pnpm dlx license-checker-rseidelsohn@5.0.1
          --production
          --excludePrivatePackages
          --summary
          --onlyAllow "Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD"

  # Every file has copyright and licence information (REUSE.toml, LICENSES/).
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: reuse-lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
