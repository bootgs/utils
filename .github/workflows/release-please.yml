# https://github.com/googleapis/release-please-action
# https://github.com/marketplace/actions/release-please-action

on:
  push:
    branches:
      - main
  # Publishes an existing release by hand (for example one released before this job existed).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to npm, e.g. v3.0.0"
        required: true

# Every job declares only the permissions it needs.
permissions: {}

name: release-please

jobs:
  release-please:
    if: github.event_name == 'push' && github.server_url == 'https://github.com' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # Manifest mode, not `release-type`. Without a manifest the action looks for
      # the previous release by walking back through the commits on main, and the
      # window it searches no longer reaches v1.10.0 — it concluded nothing had
      # ever been released and proposed 1.0.0.
      - name: release-please-action
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing (OIDC): no npm token is stored in GitHub. Needs a trusted publisher on
  # npmjs.com → @bootgs/utils → Settings → Trusted publishing: GitHub Actions, bootgs/utils,
  # workflow release-please.yml, environment npm.
  publish:
    needs: release-please
    if: >-
      always() && github.server_url == 'https://github.com' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm test

      # The packed tarball is what goes to npm and, signed, to the GitHub release.
      - name: pack
        id: pack
        run: echo "file=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"

      # Skipped when this version is already on npm (for example the first release of a new
      # package name, published by hand); the tarball still goes to the GitHub release.
      - name: publish
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm, not published again"
          else
            npm publish "./$FILE" --provenance --access public
          fi

      - name: keep-package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          retention-days: 5

  # Release assets: CycloneDX SBOM of the production dependency tree, the npm tarball and its
  # signed build provenance (Sigstore bundle from actions/attest-build-provenance).
  sbom:
    needs: [release-please, publish]
    if: >-
      always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: install
        run: npm ci --ignore-scripts

      - name: sbom
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: download-package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: attest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/*.tgz

      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          tgz=$(ls package/*.tgz)
          cp "$BUNDLE" "$tgz.sigstore.json"
          gh release upload "$TAG" sbom.cdx.json "$tgz" "$tgz.sigstore.json" --clobber --repo "$GITHUB_REPOSITORY"
